# Eval for the RAG grounding prompt in use_cases/rag_chatbot.py (generate_answer)
# Run from this directory:  promptfoo eval && promptfoo view
description: "RAG chatbot grounding prompt — faithfulness & refusal"

# The prompt under test. Mirrors generate_answer() in use_cases/rag_chatbot.py.
# {{context}} and {{query}} are filled per test case below.
prompts:
  - |
    You are a helpful assistant. Answer the question using ONLY the context below.
    If the answer is not in the context, say "I don't know based on the provided documents."

    Context:
    {{context}}

    Question: {{query}}
    Answer:

# Uses your local Ollama (completion API, like client.generate in the code).
# Set OLLAMA_BASE_URL if it isn't on the default localhost:11434.
providers:
  - id: ollama:completion:llama3.2
    config:
      temperature: 0   # deterministic, so eval results are stable

# Reusable grading criteria applied to every test
defaultTest:
  options:
    # Local LLM-judge — no API key needed (weaker grader than a frontier model).
    provider: ollama:chat:llama3.2

tests:
  # 1. Answer IS in context → must answer correctly and stay grounded
  - description: "Answerable: machine learning"
    vars:
      context: "[Source: ml-intro]\nMachine learning is a subset of artificial intelligence that enables systems to learn and improve from experience without being explicitly programmed."
      query: "What is machine learning?"
    assert:
      - type: llm-rubric
        value: "Does the answer say machine learning is a subset of AI that learns/improves from experience or data? Answer yes if that idea is present, ignoring wording."
      - type: not-contains
        value: "I don't know based on the provided documents"

  # 2. Answer is NOT in context → must refuse with the exact phrase
  - description: "Unanswerable: speed of light, but only biology context given"
    vars:
      context: "[Source: biology-101]\nThe mitochondria is the powerhouse of the cell, responsible for producing ATP through cellular respiration."
      query: "What is the speed of light?"
    assert:
      - type: icontains
        value: "I don't know based on the provided documents"

  # 3. Distractor context present → must not hallucinate the missing fact
  - description: "Unanswerable with related-but-insufficient context"
    vars:
      context: "[Source: ml-intro]\nDeep learning uses neural networks with many layers to model complex patterns in data."
      query: "Who invented the transformer architecture?"
    assert:
      - type: icontains
        value: "I don't know based on the provided documents"
      - type: llm-rubric
        value: "Does the answer avoid naming any specific person, year, or paper as the transformer's inventor? Answer yes if no such name/date is given."

  # 4. Multiple sources in context → must synthesize only from them
  - description: "Multi-source grounding"
    vars:
      context: |
        [Source: physics-101]
        The speed of light in a vacuum is approximately 299,792 kilometers per second, often denoted as c in physics equations.

        [Source: geography]
        Paris is the capital and most populous city of France.
      query: "What is the speed of light?"
    assert:
      - type: icontains
        value: "299,792"
      - type: llm-rubric
        value: "Does the answer state the speed of light is about 299,792 km/s? Answer yes if that number appears, regardless of wording."

  # 5. Faithfulness check: context contradicts common knowledge → must follow context
  - description: "Must trust context over prior knowledge"
    vars:
      context: "[Source: fictional-almanac]\nThe planet Zorbon has exactly three moons named Ay, Bee, and Cee."
      query: "How many moons does Zorbon have, and what are their names?"
    assert:
      # Deterministic facts from context — robust without a judge
      - type: icontains
        value: "three"
      - type: icontains
        value: "Ay"
      - type: icontains
        value: "Bee"
      - type: icontains
        value: "Cee"
      - type: llm-rubric
        value: "Does the answer say Zorbon has three moons named Ay, Bee, and Cee? Answer yes if those facts are present, ignoring wording or formatting."
