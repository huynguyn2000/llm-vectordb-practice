[project]
name = "llm-vectordb-practice"
version = "0.1.0"
description = "Vector DB use cases with pgvector + Ollama"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "ollama>=0.3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "tiktoken>=0.7",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
langchain = ["langchain>=0.3,<0.4", "langchain-ollama>=0.2", "langsmith>=0.1"]
orchestration = ["dagster>=1.8,<2", "dagster-webserver>=1.8,<2"]
chroma = ["chromadb>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "use_cases", "data", "ingestion", "search", "langchain_rag","orchestration", "vectorstores", "vectorstores.tests"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = ["integration: requires a running Postgres (docker compose up -d)"]

[tool.dagster]
module_name = "orchestration.definitions"
